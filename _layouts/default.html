<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/favicon.png">
  
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="keywords" content="{{ page.keywords | default: '' }}">
  <meta name="author" content="Aaron Suarez">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.canonical | default: site.url }}{{ page.url }}">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.canonical | default: site.url }}{{ page.url }}">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Global CSS (single source of truth) -->
  <link rel="stylesheet" href="{{ "/assets/css/global.css" | relative_url }}">
  
  <!-- Google Analytics (site‑wide) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GYPEWZXH03"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-GYPEWZXH03', { page_title: '{{ page.title }}', page_path: '{{ page.url }}' });
  </script>
  
  <!-- Page‑specific JSON‑LD can be added via front matter or directly in the page -->
  {% if page.jsonld %}
  <script type="application/ld+json">{{ page.jsonld | jsonify }}</script>
  {% endif %}
</head>
<body id="top">
  {% include header.html %}
  <main id="main-content">
    {{ content }}
  </main>
  {% include footer.html %}
  <a class="quick-anchor" href="#top" aria-label="Back to top">↑ top</a>
  <script>document.getElementById('yr') && (document.getElementById('yr').textContent = new Date().getFullYear());</script>
  <script src="{{ "/assets/js/main.js" | relative_url }}" defer></script>
</body>
</html>
